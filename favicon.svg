<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="sun-g">
      <stop offset="0%" stop-color="#fffde0"/>
      <stop offset="50%" stop-color="#ffd93d"/>
      <stop offset="100%" stop-color="#ff8c00"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <circle cx="50" cy="50" r="50" fill="#0a0a14"/>
  <!-- Orbit ring -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- Sun -->
  <circle cx="50" cy="50" r="14" fill="url(#sun-g)"/>
  <!-- Planet -->
  <circle cx="83" cy="42" r="7" fill="#4ecdc4" opacity="0.9"/>
  <!-- Ring on planet -->
  <ellipse cx="83" cy="42" rx="11" ry="3" fill="none" stroke="#4ecdc4" stroke-width="1.5" opacity="0.5"/>
  <!-- Small planet -->
  <circle cx="25" cy="65" r="5" fill="#a78bfa" opacity="0.8"/>
</svg>
